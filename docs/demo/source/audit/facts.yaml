# Audit facts for the ddmrp-buffers demo video.
# Read by docs/demo/source/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: ddmrp-buffers
  title: "ddmrp-buffers: demo video audit report"
  repo_url: https://github.com/kavya2693/ddmrp-buffers
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 86.4
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [numpy, pandas, matplotlib]
  regenerate:
    - "make run                                   # data/*.csv, outputs/results.json, frontier.csv, segments.csv, 3 PNGs (~20 s)"
    - "python3 docs/demo/source/tools/darkmap.py outputs docs/demo/source/assets"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_po_sheet.py docs/demo/source/assets/po_sheet.json 2025-09-08"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/po_sheet.json docs/demo/source/compositions/value.html --rows LUB-0022,LUB-0304,LUB-0540,LUB-0079,LUB-0788,LUB-0035 --animate LUB-0022,LUB-0304,LUB-0079,LUB-0035"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/ddmrp-buffers-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/ddmrp-buffers-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 20240101, lead_time_draw_seed: 7, extra_range_seeds: "20240102, 20240103, 20240104"}
  run_time: "README 'Running it': make run takes about 20 s on the author's laptop (results.json does not record a run time)"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (800 SKUs, three years of daily demand, 4,702 bulk orders). The production data is proprietary."
    source: "scripts/generate_data.py; src/ddmrp_buffers/data.py:95-188 (generate); config.py:8 (SEED = 20240101); README 'The data'"
    all_figures: true
    edit: ["src/ddmrp_buffers/data.py", "src/ddmrp_buffers/config.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "Bulk fleet orders are announced 3 to 21 days before they ship: 60% of SKUs packed in 18 L or more get 2-8 such orders a year (15% of the rest get 2). Their share (13.6% of demand value) and notice period are generator choices, not measurements; DDMRP's edge over the reorder point depends on them."
    source: "src/ddmrp_buffers/data.py:154-171; README 'Known limitations' (the biggest gap)"
    figures: [F-08, F-09, F-16, F-17, F-18, F-36, F-37, F-38, F-49, F-50, F-51, F-52]
    edit: ["src/ddmrp_buffers/data.py:157-169"]
    rerun: ["make data", "make run", "export_po_sheet.py + inject_sheet.py"]
  - id: A-03
    statement: "Unfilled demand is lost, not backordered (a workshop buys the drum elsewhere). Fill rate is the share of demand value shipped on the day it was due."
    source: "src/ddmrp_buffers/simulate.py:81-83; metrics.py:27; docs/adr/0001-compare-at-matched-service.md"
    figures: [F-18, F-29, F-33, F-34, F-43, F-44, F-49, F-50, F-51, F-53]
    edit: ["src/ddmrp_buffers/simulate.py:81-83"]
    rerun: ["make run"]
  - id: A-04
    statement: "Lead times: local blends 5-14 days, imports 45-90 days. Realised lead times drift (sd 15% blends, 10% imports) and 10% of import orders are held at the port for 14-35 extra days."
    source: "src/ddmrp_buffers/data.py:109-114; simulate.py:42-51 (actual_lead_times)"
    figures: [F-07, F-21, F-33, F-34, F-41, F-44, F-49, F-50, F-51]
    edit: ["src/ddmrp_buffers/data.py:109-114", "src/ddmrp_buffers/simulate.py:46-50"]
    rerun: ["make data", "make run"]
  - id: A-05
    statement: "DDMRP settings: 84-day ADU window, buffers recalculated every 7 days, lead-time factor 0.7 / 0.5 / 0.3 by lead-time band, variability factor 0.3 / 0.5 / 0.8 by weekly CV, a customer order counts early if it is at least half the red zone and due within the lead time, order cycle 7 days (blend) / 30 days (import)."
    source: "src/ddmrp_buffers/config.py:22-41 (DdmrpSettings)"
    figures: [F-11, F-12, F-22, F-33, F-34, F-36, F-37, F-38, F-40, F-42, F-43, F-44, F-49, F-50]
    edit: ["src/ddmrp_buffers/config.py:24-41"]
    rerun: ["make run", "export_po_sheet.py + inject_sheet.py"]
  - id: A-06
    statement: "Legacy min-max: min = usage over lead time + 30 days, max = min + 90 days (blend) or 180 days (import), reset once a year from last year's average daily usage."
    source: "src/ddmrp_buffers/config.py:44-50; policies.py:60-79"
    figures: [F-29, F-33, F-34, F-45, F-47, F-53]
    edit: ["src/ddmrp_buffers/config.py:48-50"]
    rerun: ["make run"]
  - id: A-07
    statement: "Tuned reorder point: z = 1.88 (97% cycle service), same 84-day window, weekly recalculation and order cycle as DDMRP. The safety knobs are swept over 11 z values (0.84-5.5) and 8 DDMRP red-zone multipliers (0.5-4.0)."
    source: "src/ddmrp_buffers/config.py:53-61; cli.py:14-15 (ROP_Z_SWEEP, DDMRP_RED_SWEEP)"
    figures: [F-25, F-27, F-33, F-34, F-43, F-44, F-51, F-53]
    edit: ["src/ddmrp_buffers/config.py:59", "src/ddmrp_buffers/cli.py:14-15"]
    rerun: ["make run"]
  - id: A-08
    statement: "Stock at matched service = DIO linearly interpolated along each policy's swept (fill rate, DIO) curve at the legacy policy's year-2 fill rate (98.46%)."
    source: "src/ddmrp_buffers/metrics.py:42-49; cli.py:172-174; docs/adr/0001-compare-at-matched-service.md"
    figures: [F-14, F-29, F-33, F-34, F-43, F-44, F-53]
    edit: ["src/ddmrp_buffers/metrics.py:42-49"]
    rerun: ["make run"]
  - id: A-09
    statement: "Headline window is year 2 of the simulation (2025), after the opening overstock has worked through; 2023 is history only, 2024-2025 are simulated (731 days)."
    source: "src/ddmrp_buffers/cli.py:141-143; config.py:10-12"
    figures: [F-24, F-29, F-33, F-34, F-43, F-44, F-45, F-46, F-47, F-49, F-50, F-51, F-53]
    edit: ["src/ddmrp_buffers/config.py:10-12"]
    rerun: ["make data", "make run"]
  - id: A-10
    statement: "Opening stock reflects generous cover (lognormal around 110 days, x1.6 on imports and on declining or phased-out SKUs): 21.5 M at cost, 172 days of trailing usage."
    source: "src/ddmrp_buffers/data.py:179-186; metrics.py:35-39"
    figures: [F-04, F-05]
    edit: ["src/ddmrp_buffers/data.py:182-184"]
    rerun: ["make data", "make run"]
  - id: A-11
    statement: "Lead-time draws use simulation seed 7 for the main range; the three extra ranges use their own seed for both the range and the draws. Slide 07 shows one day (Monday 2025-09-08) of the same DDMRP run, chosen by the video author as a weekday with both imports and customer-order pulls."
    source: "src/ddmrp_buffers/simulate.py:55 (seed=7); cli.py:120-131; demo tools/export_po_sheet.py"
    figures: [F-35, F-36, F-37, F-38, F-39, F-40, F-42, F-44, F-45]
    edit: ["docs/demo/source/tools/export_po_sheet.py (day argument)"]
    rerun: ["export_po_sheet.py + inject_sheet.py", "hyperframes render"]
  - id: A-12
    statement: "Purchase orders are counted, not costed: there is no ordering or freight cost in the comparison."
    source: "src/ddmrp_buffers/metrics.py:31; README 'Known limitations'"
    figures: [F-46, F-47]
    edit: ["src/ddmrp_buffers/metrics.py"]
    rerun: ["make run"]
  - id: A-13
    statement: "Video rounding: days to 1 decimal, fill rates to 2 decimals, headline percentages to whole numbers, money to 0.1 M or whole units; '~20 s', 'about 70%' and '60%' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-04, F-05, F-06, F-10, F-14, F-20, F-34, F-43, F-46, F-52, F-53]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-14
    statement: "Slide 01 (industries, everyday problems) is general distribution knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports all four problems"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: lubricant & chemical distributors, industrial spare parts, auto-parts wholesale", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (min-max set once a year; long, late imports; one big order empties the shelf; months of stock on slow sellers)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 13-27", formula: "-",
     check: {expr: "grep('README.md', r'set once a year') and grep('README.md', r'six weeks to three months') and grep('README.md', r'forty drums') and grep('README.md', r'barely sell')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "03", "05", "08", "10"], label: "SKUs in the range", shown: "800 SKUs", type: direct, source: "outputs/results.json", key: "dataset.skus", formula: "-",
     check: {expr: "J('outputs/results.json')['dataset']['skus']", fmt: "{:.0f}", expect: "800"}}
  - {id: F-04, slides: ["02"], label: "Opening stock at cost", shown: "21.5M in stock", type: direct, source: "outputs/results.json", key: "opening_stock_value = 21,516,738", formula: "/ 1e6, 1 decimal",
     check: {expr: "J('outputs/results.json')['opening_stock_value'] / 1e6", fmt: "{:.1f}M", expect: "21.5M"}}
  - {id: F-05, slides: ["02"], label: "Opening days of cover", shown: "172 days of cover", type: direct, source: "outputs/results.json", key: "opening_dio_days = 172.03", formula: "-",
     check: {expr: "J('outputs/results.json')['opening_dio_days']", fmt: "{:.0f}", expect: "172"}}
  - {id: F-06, slides: ["02"], label: "Share of SKUs imported", shown: "26% imports", type: direct, source: "outputs/results.json", key: "dataset.import_share = 0.26375", formula: "x 100",
     check: {expr: "J('outputs/results.json')['dataset']['import_share'] * 100", fmt: "{:.0f}%", expect: "26%"}}
