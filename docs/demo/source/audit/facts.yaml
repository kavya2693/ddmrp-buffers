slides:
  - id: "01"
    title: "The industry"
    image: slides/slide-01.jpg
    time: "0.0-7.2 s"
    composition: "compositions/s01-context.html"
    text:
      - "01 · THE INDUSTRY"
      - "Every week, purchasing decides how much of every SKU to buy."
      - "WHO LIVES WITH THIS · Lubricant & chemical distributors · Industrial spare parts · Auto-parts wholesale"
      - "01 Min-max levels set once a year — Stale by the time demand shifts"
      - "02 Imports take months and arrive late — A held shipment becomes an empty shelf"
      - "03 One big customer order empties the shelf — The sale goes to a competitor"
      - "04 Months of stock on items that barely sell — Cash the finance team cannot use"
      - "THIS PROJECT holds less stock without losing service · history → buffers → orders → fill rate"
    assumptions: [A-14]
    illustrative: ["The whole slide is context; no repo figures."]
    change: "Edit the chips (#ctx-c1..3) and cards (#ctx-k1..4) in compositions/s01-context.html."
  - id: "02"
    title: "This project"
    image: slides/slide-02.jpg
    time: "6.8-11.6 s"
    composition: "compositions/s02-hook.html"
    text:
      - "02 · THIS PROJECT"
      - "800 SKUs, 21.5M in stock. 172 days of cover. Cut it without losing customers."
      - "26% imports, 45–90 d lead · 4,702 bulk orders, 3–21 d notice · 60% of SKU-days sell nothing"
    assumptions: [A-01, A-02, A-04, A-10]
    illustrative: ["Rings in the background are decoration."]
    change: "Headline spans #hook-l1..l3 and chips #hook-f1..f3 in compositions/s02-hook.html; numbers from outputs/results.json (dataset, opening_*)."
  - id: "03"
    title: "How it works (white chapter, slide A)"
    image: slides/slide-03.jpg
    time: "11.3-19.3 s"
    composition: "compositions/explainer.html (CONFIG.blocks, CONFIG.groups, CONFIG.loop)"
    text:
      - "03 · HOW IT WORKS"
      - "From sales history to orders"
      - "SALES HISTORY 800 SKUs, every day → [EVERY 7 DAYS: DEMAND RATE 84-day average → BUFFERS red, yellow and green zones] → [EVERY DAY: NET FLOW stock + incoming − big orders → REORDER fill back up to green] → ORDERS OUT ✓ 47% less stock ✓ same fill rate ✓ case + MOQ"
      - "all 800 SKUs, daily (loop over REORDER)"
    assumptions: [A-05, A-08]
    illustrative: ["Icons and colours are a visual language, not data.", "'same fill rate' and '47% less stock' hold at matched service (A-08), not at default settings."]
    change: "Edit CONFIG in compositions/explainer.html; badge truth from outputs/results.json matched_service (F-14)."
  - id: "04"
    title: "The key idea (white chapter, slide B)"
    image: slides/slide-04.jpg
    time: "19.3-26.3 s"
    composition: "compositions/explainer.html (slide B markup + its timeline block)"
    text:
      - "04 · THE KEY IDEA"
      - "Seeing big orders early"
      - "Fleet customers book big orders early — 3 to 21 days before they ship"
      - "Net flow counts them right away — on hand + on order − orders already placed"
      - "So the reorder covers them in time — a reorder point sees them only when they ship"
      - "ONE SKU · THE HAND-WORKED TEST: net flow 170 → 140; red 105 · yellow 205 · green 275; on hand 120 + on order 50; − customer order 30"
      - "Order 144 = 275 − 140, in cases of 12. Without the customer order: 108."
      - "Switch it off and DDMRP falls to the reorder point's fill rate: 94.49% vs 94.51% (year 2)."
    assumptions: [A-02, A-05]
    illustrative: ["The buffer bar is drawn to scale for the hand-worked test SKU (tests/test_buffers.py), not a SKU from the range."]
    change: "Slide B markup and the 'hand-worked buffer' block in the explainer timeline; the 108 is derived (F-17)."
  - id: "05"
    title: "Architecture"
    image: slides/slide-05a.jpg
    image2: slides/slide-05b.jpg
    time: "26.0-40.8 s"
    composition: "compositions/s03-architecture.html (node markup + the wires list)"
    text:
      - "05 · ARCHITECTURE — Weekly buffers, a daily net-flow decision, one scorer."
      - "1 SOURCES: Generator (generate_data.py, seed 20240101) → skus.csv 800 · LT · MOQ · demand.csv.gz 1,096 d × 800 · bulk_orders.csv 4,702 · 3–21 d · 2023: 4.7% missing"
      - "2 LOAD: Load range (data.load(), → Dataset) · Sim context (context(), LT · MOQ · cost) · Lead times (simulate.py, +14–35 d holds)"
      - "3 POLICY LOGIC: Buffer sizing (buffers.py, ADU 84 d · LTF · VF, red · yellow · green) · Slow movers (classify.py, 4 classes · 180 d) · Policies (policies.py, legacy · ROP · DDMRP) · Set by hand (config.py, factors, windows)"
      - "4 DECIDE + SIMULATE: Net-flow decision (Ddmrp.order(): on hand + on order − customer orders placed; ≤ TOY? yes: up to TOG; round to MOQ · case) · Daily loop (simulate.py: receive → ship → order; unfilled demand = lost; day 0→731 / 731, 800 SKUs) · alternate rules (spikes off (ablation); dormant: buy to order)"
      - "5 EVALUATE: KPIs (metrics.kpis(): DIO · value fill rate, stockouts · POs) · Matched service (metrics.py: DIO @ legacy 98.46%) · outputs/ (results.json · csv, charts.py → 3 PNG) · Sweep + seeds (cli.py: 11 z · 8 red sizes, + 3 fresh ranges) · 90 runs in ≈ 20 s"
      - "Edge labels: make data · open bulk orders, daily · 84-d window · weekly · realised lead time · zones · order qty · stock · ×90"
      - "Legend: per-day call · weekly / batch · feedback · data store · set by hand · alternate path · decision"
      - "Second phase (38.0-40.8 s): critical path: bulk order → net flow → fill rate (bulk_orders.csv → data.load() → context() → Ddmrp.order() → daily loop → KPIs → matched service → outputs/)"
    assumptions: [A-01, A-02, A-04, A-05, A-07, A-08]
    illustrative: ["Packets and the day counter show execution order, not real-time speed.", "'alternate rules' groups two real code paths: the no-spike ablation arm (use_spikes=False) and the slow-mover rule (dormant SKUs bought only against an order in hand).", "The critical-path highlight is emphasis only."]
    change: "Boxes are absolutely positioned divs in compositions/s03-architecture.html; wires are the `wires` point lists in its script (keep them orthogonal and matching the box edges); `crit: true` and `critNodes` set the highlighted path."
  - id: "06"
    title: "The system running"
    image: slides/slide-06a.jpg
    image2: slides/slide-06b.jpg
    time: "40.4-55.0 s"
    composition: "compositions/s04-routes.html"
    text:
      - "06 · THE SYSTEM RUNNING — Two years, day by day: every SKU holds its own buffer."
      - "LOCAL BLEND · 5-DAY LEAD — Opening overstock burns off, then on-hand cycles through yellow and green"
      - "IMPORT · 79-DAY LEAD — Big zones for a long lead time, late shipments still push it to zero"
      - "Second phase: Same fill rate as today, far less stock."
      - "AT TODAY'S FILL RATE · 98.46% — days of stock each policy needs (year 2): Min-max (legacy) 97.6 · Reorder point (tuned) 65.9 · DDMRP 52.1 — 52.1 days −47%"
      - "each policy swept over its one safety knob, then read at the legacy fill rate"
    assumptions: [A-04, A-07, A-08, A-09]
    illustrative: ["Panels are outputs/buffer_chart.png and outputs/frontier.png converted to dark by tools/darkmap.py; nothing is redrawn.", "The dashed line and rings on the frontier are annotations (F-32).", "Side captions describe what the two plotted SKUs show (README 'How it works')."]
    change: "Re-run tools/darkmap.py after make run; bar widths in #routes-f1..3 are 520 x DIO / 97.6; the counter tweens 97.6 → 52.1."
  - id: "07"
    title: "End-user value (white)"
    image: slides/slide-07.jpg
    time: "54.7-67.7 s"
    composition: "compositions/value.html (SHEET injected by tools/inject_sheet.py)"
    text:
      - "07 · END-USER VALUE — What the planner gets"
      - "PURCHASE ORDER PROPOSALS · MON 2025-09-08 · DDMRP"
      - "SKU · PRODUCT · FROM · STOCK · OPEN PO · BOOKED · NET FLOW · BUY · DUE"
      - "LUB-0022 HD engine oil 1,000 L blend 2 0 −2 0 3 Sep 13"
      - "LUB-0304 Gear oil 208 L blend 0 3 0 3 6 Sep 16"
      - "LUB-0540 Hydraulic oil 20 L blend 135 0 0 135 221 Sep 13"
      - "LUB-0079 Car engine oil 20 L import 6 46 0 52 76 Nov 10"
      - "LUB-0788 Hydraulic oil 208 L import 7 0 −4 3 5 Nov 3"
      - "LUB-0035 Gear oil 20 L import 43 0 −8 35 42 Oct 28"
      - "+ 43 more SKUs to order today, most urgent first"
      - "49 purchase orders · 127,376 at cost · 7 pulled in by customer orders"
      - "Scene: WAREHOUSE · NET FLOW PER SKU (#0022 +3, #0304 +6, #0079 +76, #0035 +42) · BLEND PLANT local · 5–14 days · PORT imports · 45–90 days"
      - "One ranked list each morning: what to buy, how much, and why. No yearly min-max guesswork."
    assumptions: [A-04, A-05, A-11]
    illustrative: ["The planner, trucks and supplier boxes are a flat 2D scene, not data.", "Gauge zones and levels are to scale per SKU from po_sheet.json (red / yellow / green, net flow, net flow + order); each gauge has its own scale.", "DUE = order day + nominal lead time; the simulation's realised lead time can differ (A-04).", "'Booked' = customer orders already placed that count against the buffer (qualified spikes)."]
    change: "Change the day in tools/export_po_sheet.py, re-run it and tools/inject_sheet.py (choose --rows / --animate from the new JSON), then render."
  - id: "08"
    title: "Results"
    image: slides/slide-08.jpg
    time: "67.4-76.2 s"
    composition: "compositions/s05-results.html"
    text:
      - "08 · RESULTS · YEAR 2, MATCHED SERVICE — Less stock at the same service, paid for in purchase orders."
      - "STOCK −47% days of stock at today's fill rate · 97.6 → 52.1 days"
      - "VS TUNED BASELINE −13.7 d beyond a tuned reorder point · 65.9 → 52.1 days"
      - "ROBUSTNESS 59.6 d worst DDMRP case, 4 ranges · legacy: 97.6–108.2 days"
      - "THE COST 5.1× purchase orders a month · 195 → 1,004 a month"
      - "800 SKUs · 731 simulated days · 5 policies · read at legacy fill 98.46%"
    assumptions: [A-07, A-08, A-09, A-12]
    illustrative: ["Mini bars are proportional to the shown ratios."]
    change: "Edit the `stats` array and card text in compositions/s05-results.html."
  - id: "09"
    title: "What didn't win"
    image: slides/slide-09.jpg
    time: "75.8-82.4 s"
    composition: "compositions/s06-twist.html"
    text:
      - "09 · WHAT DIDN'T WIN — DDMRP's zones alone don't beat a tuned reorder point."
      - "Year 2, default settings, all holding about 40 days of stock: value fill rate"
