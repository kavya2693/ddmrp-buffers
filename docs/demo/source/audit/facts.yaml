# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  def _cli_list(name):
      m = _re.search(name + r" = \[([^\]]*)\]", T('src/ddmrp_buffers/cli.py'))
      return [x for x in m.group(1).split(",") if x.strip()]
  def sweep_sizes():
      return f"{len(_cli_list('ROP_Z_SWEEP'))} z, {len(_cli_list('DDMRP_RED_SWEEP'))} red"
  def runs_per_make_run():
      cli = T('src/ddmrp_buffers/cli.py')
      arms_src = cli.split("def arms")[1].split("\ndef ")[0]
      arms = len(_re.findall(r"policies\.(?:LegacyMinMax|ReorderPoint|Ddmrp)\(", arms_src))
      sweep = len(_cli_list('ROP_Z_SWEEP')) + len(_cli_list('DDMRP_RED_SWEEP'))
      extra_src = cli.split("def robustness_on_new_seed")[1].split("\ndef ")[0]
      extra_policies = len(_re.findall(r"policies\.(?:LegacyMinMax|ReorderPoint|Ddmrp)\(\)", extra_src))
      extra = len(J('outputs/results.json')['robustness']) - 1
      return arms + sweep + extra * (extra_policies + sweep)
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported purchase-order sheet."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      src_json = J('demo:assets/po_sheet.json')
      src = {r['sku']: r for r in src_json['rows']}
      for r in sheet['rows']:
          for k, v in r.items():
              if k != 'animate' and src[r['sku']][k] != v:
                  return False
      skus = [r['sku'] for r in sheet['rows']]
      return skus == ['LUB-0022', 'LUB-0304', 'LUB-0540', 'LUB-0079', 'LUB-0788', 'LUB-0035'] and sheet['orders'] == src_json['orders']
