<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #twist-root { position: absolute; inset: 0; }
        #twist-root .eyebrow { color: var(--c-risk); }
        #twist-root .sub { position: absolute; left: 120px; top: 200px; font-size: 32px; color: var(--ink-soft); }
        #twist-root .bars { position: absolute; left: 120px; top: 310px; width: 1680px; }
        #twist-root .row { display: flex; align-items: center; height: 112px; }
        #twist-root .who { width: 470px; font-size: 36px; font-weight: 700; color: var(--ink); }
        #twist-root .who small { display: block; font-family: var(--mono); font-size: 22px; font-weight: 400; color: var(--ink-mute); }
        #twist-root .track { position: relative; width: 1000px; height: 44px; border-radius: 8px; background: rgba(178, 191, 204, 0.08); }
        #twist-root .fill { position: absolute; left: 0; top: 0; height: 44px; border-radius: 8px; background: var(--ink-mute); transform-origin: left center; }
        #twist-root .val { width: 210px; text-align: right; font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--ink-soft); }
        #twist-root .ddm .fill { background: var(--c-opt); }
        #twist-root .ddm .val { color: var(--c-opt); }
        #twist-root .off .fill { background: var(--c-risk); }
        #twist-root .off .val { color: var(--c-risk); }
        #twist-root .rop .fill { background: var(--c-data); }
        #twist-root .rop .val { color: var(--c-data); }
        #twist-root .ticks { position: absolute; left: 0; top: 6px; width: 1000px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 22px; color: var(--ink-mute); }
        #twist-root .verdict {
          position: absolute; left: 120px; top: 806px; width: 1680px; padding: 22px 28px; border-radius: 12px;
          border: 2px solid rgba(255, 138, 115, 0.45); background: rgba(255, 138, 115, 0.07);
          font-size: 30px; line-height: 1.4; color: var(--ink);
        }
        #twist-root .verdict b { color: var(--c-risk); }
      </style>
      <div id="twist-root" data-composition-id="twist" data-width="1920" data-height="1080">
        <div class="scene" id="twist-in">
          <div class="eyebrow" data-layout-allow-overlap id="twist-eyebrow">09 · What didn't win</div>
          <div class="scene-title" data-layout-allow-overlap id="twist-title">DDMRP's zones alone don't beat a tuned reorder point.</div>
          <div class="sub" id="twist-sub">Year 2, default settings, all holding about 40 days of stock: value fill rate</div>
          <div class="bars">
            <div class="row ddm" id="twist-r1"><div class="who">DDMRP<small>with customer orders · 39.9 d</small></div>
              <div class="track"><div class="fill" id="twist-b1" style="width: 661px"></div></div><div class="val">96.61%</div></div>
            <div class="row off" id="twist-r2"><div class="who">DDMRP, spikes off<small>zones only · 39.8 d</small></div>
              <div class="track"><div class="fill" id="twist-b2" style="width: 449px"></div></div><div class="val">94.49%</div></div>
            <div class="row rop" id="twist-r3"><div class="who">Reorder point (tuned)<small>z = 1.88 · 40.1 d</small></div>
              <div class="track"><div class="fill" id="twist-b3" style="width: 451px"></div></div><div class="val">94.51%</div></div>
            <div class="row" id="twist-r4"><div class="who"><small>bars start at 90%</small></div>
              <div class="track" style="background: none"><div class="ticks"><span>90%</span><span>95%</span><span>100%</span></div></div><div class="val"></div></div>
          </div>
          <div class="verdict" id="twist-verdict"><b>Why:</b> the edge is counting customer orders already placed (13.6% of demand value here), not the zones. And about 70% of the stock cut comes from recalculating weekly at all.</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 6.6;
          tl.fromTo("#twist-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#twist-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#twist-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#twist-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
          [1, 2, 3, 4].forEach((n, i) => {
            tl.fromTo("#twist-r" + n, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.8 + i * 0.15);
            if (n < 4) tl.fromTo("#twist-b" + n, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 1.0 + i * 0.15);
          });
          tl.fromTo("#twist-verdict", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.4);
          tl.to("#twist-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["twist"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
