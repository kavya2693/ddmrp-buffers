<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* WHITE "END-USER VALUE" SLIDE: the purchase-order proposals the planner works from (left) + a small 2D scene
           of the planner using them (right). Data is inlined by tools/inject_sheet.py between the SHEET markers. */
        #value-root {
          position: absolute; inset: 0;
          --w-bg: #ffffff; --w-ink: #111827; --w-soft: #4b5563; --w-mute: #6b7280; --w-line: #d1d5db; --w-faint: #f3f4f6;
          --w-data: #d97706; --w-model: #6d3cf0; --w-tools: #1f8fa8; --w-risk: #dc2b4a; --w-opt: #0f9f6e;
          color: var(--w-ink); font-family: Inter, "Helvetica Neue", sans-serif;
        }
        #value-root .page { position: absolute; inset: 0; background: var(--w-bg); }
        #value-root .edge { position: absolute; top: 0; width: 10px; height: 1080px; background: var(--w-model); }
        #value-root .kick {
          position: absolute; left: 120px; top: 84px; font-family: "JetBrains Mono", monospace; font-size: 24px;
          font-weight: 700; letter-spacing: 0.18em; color: var(--w-mute);
        }
        #value-root .ttl {
          position: absolute; left: 120px; top: 124px; font-family: Montserrat, sans-serif; font-weight: 900;
          font-size: 68px; letter-spacing: -0.02em; white-space: nowrap;
        }
        #value-root .ttl em { font-style: normal; color: var(--w-model); }
        #value-root .uline { position: absolute; left: 124px; top: 222px; width: 120px; height: 10px; border-radius: 5px; background: var(--w-model); transform-origin: left center; }

        /* sheet */
        #value-root .sheet {
          position: absolute; left: 120px; top: 270px; width: 1070px; height: 650px; border: 3px solid var(--w-line);
          border-radius: 24px; background: #fff; box-shadow: 0 18px 40px rgba(17, 24, 39, 0.08); overflow: hidden;
        }
        #value-root .sheet-head {
          height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
          background: var(--w-ink); color: #fff; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
        }
        #value-root .sheet-head span:last-child { color: #c4b5fd; }
        #value-root .row {
          position: relative; display: flex; align-items: center; height: 66px; padding: 0 22px;
          font-family: "JetBrains Mono", monospace; font-size: 21px; color: var(--w-ink); border-bottom: 2px solid var(--w-faint);
        }
        #value-root .row.hdr { height: 54px; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; color: var(--w-mute); background: #fafafa; }
        #value-root .row .tint { position: absolute; inset: 0; opacity: 0; }
        #value-root .c { position: relative; white-space: nowrap; }
        #value-root .c1 { width: 132px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
        #value-root .c1 i { display: block; width: 14px; height: 14px; border-radius: 4px; background: var(--w-line); flex: 0 0 auto; }
        #value-root .c2 { width: 232px; font-family: Inter, sans-serif; font-size: 21px; }
        #value-root .c3 { width: 84px; color: var(--w-soft); }
        #value-root .c4, #value-root .c5, #value-root .c6 { width: 86px; text-align: right; padding-right: 12px; }
        #value-root .c5 { width: 92px; }
        #value-root .c6 { width: 84px; }
        #value-root .c6.hot { color: var(--w-risk); font-weight: 700; }
        #value-root .c7 { width: 120px; display: flex; align-items: center; gap: 8px; padding-left: 4px; }
        #value-root .c7 .zb { position: relative; display: block; width: 46px; height: 12px; border-radius: 6px; background: #eef0f3; overflow: hidden; }
        #value-root .c7 .zb b { position: absolute; left: 0; top: 0; height: 12px; border-radius: 6px; }
        #value-root .c8 { width: 76px; text-align: right; padding-right: 14px; font-weight: 700; color: var(--w-model); }
        #value-root .c9 { width: 80px; color: var(--w-soft); }
        #value-root .more { padding: 14px 28px 0; font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--w-mute); }
        #value-root .totals {
          position: absolute; left: 0; bottom: 0; width: 100%; height: 66px; display: flex; align-items: center; gap: 14px; padding: 0 28px;
          background: #ecfdf5; border-top: 2px solid #a7f3d0; font-size: 23px; font-weight: 700; color: #065f46; white-space: nowrap;
        }
        #value-root .totals b { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--w-opt); position: relative; flex: 0 0 auto; }
        #value-root .totals svg { position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; }

        /* scene */
        #value-root .scene-lab { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; letter-spacing: 0.14em; color: var(--w-mute); white-space: nowrap; }
        #value-root .floor { position: absolute; left: 1240px; top: 300px; width: 580px; height: 400px; border-radius: 24px; background: var(--w-faint); }
        #value-root .src {
          position: absolute; top: 740px; height: 116px; border-radius: 20px; border: 3px solid var(--w-line); background: #fbfbfc;
          display: flex; flex-direction: column; justify-content: center; padding: 0 20px;
        }
        #value-root .src .n { font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; letter-spacing: 0.1em; color: var(--w-ink); white-space: nowrap; }
        #value-root .src .d { margin-top: 4px; font-size: 21px; color: var(--w-soft); white-space: nowrap; }
        #value-root svg.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #value-root .caption {
          position: absolute; left: 120px; top: 946px; width: 1700px; font-size: 30px; font-weight: 700; color: var(--w-ink);
        }
        #value-root .caption span { color: var(--w-model); }
      </style>

      <div id="value-root" data-composition-id="value" data-width="1920" data-height="1080">
        <div class="page" id="va-page">
          <div class="kick" id="va-kick">07 · END-USER VALUE</div>
          <div class="ttl" id="va-ttl">What the <em>planner</em> gets</div>
          <div class="uline" id="va-ul"></div>

          <div class="sheet" id="va-sheet">
            <div class="sheet-head"><span id="va-head-l">PURCHASE ORDER PROPOSALS</span><span id="va-head-r"></span></div>
            <div class="row hdr" id="va-hdr">
              <div class="c c1">SKU</div><div class="c c2" style="font-family: 'JetBrains Mono', monospace; font-size: 18px">PRODUCT</div>
              <div class="c c3">FROM</div><div class="c c4">STOCK</div><div class="c c5">OPEN PO</div><div class="c c6">BOOKED</div>
              <div class="c c7">NET FLOW</div><div class="c c8">BUY</div><div class="c c9">DUE</div>
            </div>
            <div id="va-rows"></div>
            <div class="more" id="va-more"></div>
            <div class="totals" id="va-totals"></div>
          </div>

          <div class="scene-lab" id="va-lab-wh" style="left: 1240px; top: 266px">WAREHOUSE · NET FLOW PER SKU</div>
          <div class="floor" id="va-floor"></div>
          <div class="src" id="va-src-l" style="left: 1240px; width: 270px"><div class="n">BLEND PLANT</div><div class="d">local · 5–14 days</div></div>
          <div class="src" id="va-src-i" style="left: 1550px; width: 270px"><div class="n">PORT</div><div class="d">imports · 45–90 days</div></div>
          <svg class="layer" id="va-svg" viewBox="0 0 1920 1080"></svg>

          <div class="caption" id="va-caption">One ranked list each morning: what to buy, how much, and why. <span>No yearly min-max guesswork.</span></div>
        </div>
        <div class="edge" id="va-edge"></div>
      </div>

      <script>
        (() => {
          /* SHEET:BEGIN */ const SHEET = {"day":"2025-09-08","weekday":"Monday","orders":49,"imports":10,"with_customer_orders":7,"order_value":127376.16,"rows":[{"sku":"LUB-0022","family":"engine_oil_heavy_duty","pack_litres":1000.0,"source":"local_blend","lead_time_days":5,"due":"2025-09-13","on_hand":2.0,"on_order":0.0,"customer_orders":2.0,"net_flow":0.0,"tor":0.6749999999999999,"toy":1.2107142857142856,"tog":2.2107142857142854,"zone":"red","priority_pct":0.0,"order_qty":3.0,"triggered_by_customer_orders":true,"animate":0},{"sku":"LUB-0304","family":"gear_oil","pack_litres":208.0,"source":"local_blend","lead_time_days":8,"due":"2025-09-16","on_hand":0.0,"on_order":3.0,"customer_orders":0.0,"net_flow":3.0,"tor":3.0,"toy":5.857142857142858,"tog":8.357142857142858,"zone":"red","priority_pct":35.8974358974359,"order_qty":6.0,"triggered_by_customer_orders":false,"animate":1},{"sku":"LUB-0540","family":"hydraulic","pack_litres":20.0,"source":"local_blend","lead_time_days":5,"due":"2025-09-13","on_hand":135.0,"on_order":0.0,"customer_orders":0.0,"net_flow":135.0,"tor":97.66250000000001,"toy":204.98392857142858,"tog":355.2339285714286,"zone":"yellow","priority_pct":38.00312671227712,"order_qty":221.0,"triggered_by_customer_orders":false,"animate":-1},{"sku":"LUB-0079","family":"engine_oil_passenger","pack_litres":20.0,"source":"import","lead_time_days":63,"due":"2025-11-10","on_hand":6.0,"on_order":46.0,"customer_orders":0.0,"net_flow":52.0,"tor":30.779999999999998,"toy":87.78,"tog":127.78,"zone":"yellow","priority_pct":40.694944435748944,"order_qty":76.0,"triggered_by_customer_orders":false,"animate":2},{"sku":"LUB-0788","family":"hydraulic","pack_litres":208.0,"source":"import","lead_time_days":56,"due":"2025-11-03","on_hand":7.0,"on_order":0.0,"customer_orders":4.0,"net_flow":3.0,"tor":1.08,"toy":3.08,"tog":7.08,"zone":"yellow","priority_pct":42.3728813559322,"order_qty":5.0,"triggered_by_customer_orders":true,"animate":-1},{"sku":"LUB-0035","family":"gear_oil","pack_litres":20.0,"source":"import","lead_time_days":50,"due":"2025-10-28","on_hand":43.0,"on_order":0.0,"customer_orders":8.0,"net_flow":35.0,"tor":11.25,"toy":36.25,"tog":76.25,"zone":"yellow","priority_pct":45.90163934426229,"order_qty":42.0,"triggered_by_customer_orders":true,"animate":3}]}; /* SHEET:END */

          const CONFIG = {
            duration: 13.0,
            colors: ["#6d3cf0", "#d97706", "#1f8fa8", "#2563eb"], // one per animated SKU
            gauges: { x: [1404, 1510, 1616, 1722], top: 330, h: 270, w: 64 }, // x = gauge centre
            person: { x: 1296, y: 640 },
          };
          const FAMILY = {
            engine_oil_passenger: "Car engine oil", engine_oil_heavy_duty: "HD engine oil", hydraulic: "Hydraulic oil",
            gear_oil: "Gear oil", transmission_fluid: "Transmission", grease: "Grease", coolant: "Coolant", industrial: "Industrial oil",
          };
          const ZONE = { red: "#dc2b4a", yellow: "#d97706", green: "#0f9f6e" };
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.getElementById("va-svg");
          const el = (tag, attrs, parent) => {
            const n = document.createElementNS(NS, tag);
            Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
            (parent || svg).appendChild(n);
            return n;
          };
          const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
          const fmt = (v) => Math.round(v).toLocaleString("en-US");
          const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const day = (iso) => MON[+iso.slice(5, 7) - 1] + " " + +iso.slice(8, 10);
          const pack = (l) => (l >= 1000 ? fmt(l) : String(l)) + " L";
          const tl = gsap.timeline({ paused: true });
          const D = CONFIG.duration;

          // ---------------- sheet ----------------
          document.getElementById("va-head-r").textContent = SHEET.weekday.slice(0, 3).toUpperCase() + " " + SHEET.day + " · DDMRP";
          const rowsEl = document.getElementById("va-rows");
          SHEET.rows.forEach((r, i) => {
            const col = r.animate >= 0 ? CONFIG.colors[r.animate] : "#d1d5db";
            const pct = Math.max(0, Math.min(1, r.net_flow / r.tog));
            rowsEl.insertAdjacentHTML("beforeend",
              '<div class="row" id="va-r' + i + '"><div class="tint" id="va-t' + i + '" style="background:' + col + '22"></div>' +
              '<div class="c c1"><i style="background:' + col + '"></i>' + r.sku + "</div>" +
              '<div class="c c2">' + FAMILY[r.family] + " " + pack(r.pack_litres) + "</div>" +
              '<div class="c c3">' + (r.source === "import" ? "import" : "blend") + "</div>" +
              '<div class="c c4">' + fmt(r.on_hand) + '</div><div class="c c5">' + fmt(r.on_order) + "</div>" +
              '<div class="c c6' + (r.customer_orders > 0 ? " hot" : "") + '">' + (r.customer_orders > 0 ? "−" + fmt(r.customer_orders) : "0") + "</div>" +
              '<div class="c c7"><span class="zb"><b style="width:' + Math.max(4, pct * 46).toFixed(0) + "px;background:" + ZONE[r.zone] + '"></b></span>' + fmt(r.net_flow) + "</div>" +
              '<div class="c c8">' + fmt(r.order_qty) + '</div><div class="c c9">' + day(r.due) + "</div></div>");
          });
          document.getElementById("va-more").textContent = "+ " + (SHEET.orders - SHEET.rows.length) + " more SKUs to order today, most urgent first";
          document.getElementById("va-totals").innerHTML =
            "<b>" + CHECK + "</b>" + SHEET.orders + " purchase orders · " + fmt(SHEET.order_value) + " at cost · " +
            SHEET.with_customer_orders + " pulled in by customer orders";

          // ---------------- scene: planner, buffer gauges, supply sources ----------------
          const P = CONFIG.person;
          const person = el("g", { id: "va-person" });
          el("circle", { cx: P.x, cy: P.y - 34, r: 16, fill: "#111827" }, person);
          el("path", { d: "M" + (P.x - 26) + " " + (P.y + 40) + "v-26a26 22 0 0 1 52 0v26z", fill: "#6d3cf0" }, person);
          const paper = el("g", { id: "va-paper" }, person);
          el("rect", { x: P.x + 18, y: P.y - 10, width: 26, height: 32, rx: 4, fill: "#fff", stroke: "#111827", "stroke-width": 2.5 }, paper);
          [0, 1, 2].forEach((k) => el("line", { x1: P.x + 23, x2: P.x + 39, y1: P.y - 2 + k * 8, y2: P.y - 2 + k * 8, stroke: "#9ca3af", "stroke-width": 2 }, paper));

          const truckShape = (g, col) => {
            el("rect", { x: -27, y: -17, width: 34, height: 24, rx: 4, fill: col }, g);
            el("path", { d: "M8 -10h10l9 9v8H8z", fill: "#111827" }, g);
            el("rect", { x: 12, y: -7, width: 7, height: 6, rx: 1.5, fill: "#e5e7eb" }, g);
            el("circle", { cx: -17, cy: 9, r: 5.5, fill: "#111827" }, g);
            el("circle", { cx: 17, cy: 9, r: 5.5, fill: "#111827" }, g);
          };

          const G = CONFIG.gauges, bottom = G.top + G.h;
          const anim = SHEET.rows.map((r, i) => ({ r, i })).filter((o) => o.r.animate >= 0).sort((a, b) => a.r.animate - b.r.animate);
          const HAND0 = 2.3, DRIVE0 = 4.9;
          anim.forEach(({ r, i }, k) => {
            const col = CONFIG.colors[r.animate], cx = G.x[k], x0 = cx - G.w / 2;
            const top = Math.max(r.tog, r.net_flow + r.order_qty) * 1.06;
            const yOf = (v) => bottom - (G.h * v) / top;
            const g = el("g", { id: "va-g" + k });
            // zones, bottom up
            el("rect", { x: x0, y: yOf(r.tor), width: G.w, height: bottom - yOf(r.tor), fill: "#fbd0d6" }, g);
            el("rect", { x: x0, y: yOf(r.toy), width: G.w, height: yOf(r.tor) - yOf(r.toy), fill: "#fde7b5" }, g);
            el("rect", { x: x0, y: yOf(r.tog), width: G.w, height: yOf(r.toy) - yOf(r.tog), fill: "#c4ebd8" }, g);
            el("rect", { x: x0, y: G.top, width: G.w, height: G.h, rx: 8, fill: "none", stroke: "#d1d5db", "stroke-width": 2.5 }, g);
            // net flow column: starts at today's position, rises by the order quantity
            const lvl = el("rect", { id: "va-lvl" + k, x: cx - 13, y: yOf(r.net_flow), width: 26, height: Math.max(0, bottom - yOf(r.net_flow)), rx: 4, fill: col }, g);
            const cap = el("rect", { x: cx - 18, y: yOf(r.net_flow) - 2, width: 36, height: 4, rx: 2, fill: "#111827" }, g);
            const lab = el("text", { x: cx, y: bottom + 30, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace", "font-size": 20, "font-weight": 700, fill: "#111827" }, g);
            lab.textContent = r.sku.replace("LUB-", "#");
            const qlab = el("text", { x: cx, y: G.top - 14, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace", "font-size": 20, "font-weight": 700, fill: col, opacity: 0 }, g);
            qlab.textContent = "+" + fmt(r.order_qty);
            const ok = el("g", { opacity: 0 }, g);
            el("circle", { cx: cx + G.w / 2 - 2, cy: G.top + 4, r: 13, fill: "#0f9f6e" }, ok);
            el("path", { d: "M" + (cx + G.w / 2 - 8) + " " + (G.top + 4.5) + "l4 4 8-8.5", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, ok);

            // gauge appears
            tl.fromTo(g, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2 + k * 0.12);
            // hand-off: the planner's line for this SKU goes to its supplier
            const isImp = r.source === "import";
            const srcX = isImp ? 1685 : 1375, srcY = 760;
            const ht = HAND0 + k * 0.5;
            tl.to("#va-t" + i, { opacity: 1, duration: 0.25 }, ht);
            const chip = el("rect", { x: -9, y: -7, width: 18, height: 14, rx: 3, fill: col, opacity: 0 });
            tl.fromTo(chip, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.05 }, ht);
            tl.fromTo(chip, { x: P.x + 31, y: P.y + 6 }, { x: srcX - 30 + k * 18, y: srcY, duration: 0.6, ease: "power2.inOut" }, ht);
            tl.to(chip, { attr: { opacity: 0 }, duration: 0.1 }, ht + 0.6);
            tl.to("#va-t" + i, { opacity: 0.45, duration: 0.4 }, ht + 0.9);
            // delivery: a truck leaves the supplier and pulls up under the gauge, net flow rises to the top of green
            const truck = el("g", { id: "va-truck" + k });
            truckShape(truck, col);
            const dt = DRIVE0 + k * 0.7;
            tl.fromTo(truck, { x: srcX, y: srcY + 50, opacity: 0, scale: 0.8 }, { x: srcX, y: srcY + 50, opacity: 1, scale: 0.8, duration: 0.3 }, dt);
            tl.to(truck, { keyframes: [{ x: srcX, y: 712, duration: 0.35, ease: "power1.in" }, { x: cx, y: 712, duration: 0.55, ease: "power1.inOut" }, { y: bottom + 70, duration: 0.25, ease: "power2.out" }] }, dt + 0.3);
            tl.to(lvl, { attr: { y: yOf(r.net_flow + r.order_qty), height: bottom - yOf(r.net_flow + r.order_qty) }, duration: 0.7, ease: "power2.out" }, dt + 1.45);
            tl.to(cap, { attr: { y: yOf(r.net_flow + r.order_qty) - 2 }, duration: 0.7, ease: "power2.out" }, dt + 1.45);
            tl.fromTo(qlab, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.3 }, dt + 1.45);
            tl.fromTo(ok, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.2 }, dt + 2.1);
            tl.to(truck, { opacity: 0, duration: 0.4 }, dt + 2.2);
          });

          // ---------------- choreography ----------------
          tl.fromTo("#va-page", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.7, ease: "power3.inOut" }, 0);
          tl.fromTo("#va-edge", { x: 0, opacity: 1 }, { x: 1920, duration: 0.7, ease: "power3.inOut" }, 0);
          tl.to("#va-edge", { opacity: 0, duration: 0.1 }, 0.7);
          tl.fromTo("#va-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo("#va-ttl", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#va-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#va-sheet", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          SHEET.rows.forEach((_, i) => tl.fromTo("#va-r" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.3 + i * 0.3));
          tl.fromTo("#va-more", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3 + SHEET.rows.length * 0.3);
          tl.fromTo("#va-totals", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          tl.fromTo(["#va-floor", "#va-lab-wh", "#va-src-l", "#va-src-i"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
          tl.fromTo("#va-person", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.fromTo("#va-paper", { rotation: 0 }, { rotation: -10, svgOrigin: CONFIG.person.x + 31 + " " + (CONFIG.person.y + 6), duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.2);
          tl.fromTo("#va-caption", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.6);
          // wipe out (white -> dark), revealing the next dark scene underneath
          tl.to("#va-page", { clipPath: "inset(0px 0px 0px 100%)", duration: 0.7, ease: "power3.inOut" }, D - 0.7);
