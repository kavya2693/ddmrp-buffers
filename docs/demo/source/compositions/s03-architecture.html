      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 14.8;
          const NS = "http://www.w3.org/2000/svg";
          const COL = { data: "#7fa8ff", model: "#b9a2ff", opt: "#3fd8a8", eval: "#f2c46d", risk: "#ff8a73", human: "#b2bfcc" };

          // cylinders for the data stores, sized to each box
          document.querySelectorAll("#arch-root .store").forEach((el) => {
            const w = parseFloat(el.style.width), h = parseFloat(el.style.height), c = el.dataset.store, ry = 12;
            el.insertAdjacentHTML("afterbegin",
              '<svg viewBox="0 0 ' + w + " " + h + '"><path d="M1 ' + ry + "V" + (h - ry) + "A" + (w / 2 - 1) + " " + ry + " 0 0 0 " + (w - 1) + " " + (h - ry) + "V" + ry +
              '" fill="#0f1a26" stroke="' + c + '" stroke-opacity="0.7" stroke-width="2"/><ellipse cx="' + w / 2 + '" cy="' + ry + '" rx="' + (w / 2 - 1) + '" ry="' + ry +
              '" fill="#132131" stroke="' + c + '" stroke-opacity="0.7" stroke-width="2"/></svg>');
          });

          tl.fromTo("#arch-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#arch-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#arch-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);

          // wires: orthogonal point lists matching the boxes above.
          // s = solid (per-day call) | dash (weekly / batch) | dot (feedback); ord = execution order for packets
          const wires = [
            { id: "make", pts: [[235, 360], [235, 400]], c: "data", s: "dash", at: 1.25, ord: 0 },
            { id: "csv1", pts: [[350, 450], [430, 450]], c: "data", s: "dash", at: 1.9, ord: 1 },
            { id: "csv2", pts: [[350, 590], [390, 590], [390, 470], [430, 470]], c: "data", s: "dash", at: 1.9, ord: 1 },
            { id: "csv3", pts: [[350, 730], [390, 730], [390, 470], [430, 470]], c: "data", s: "dash", at: 1.9, ord: 1, crit: true },
            { id: "ds", pts: [[545, 500], [545, 540]], c: "data", s: "solid", at: 2.6, ord: 2, crit: true },
            { id: "lt", pts: [[545, 640], [545, 680]], c: "data", s: "solid", at: 2.6, ord: 3 },
            { id: "win", pts: [[660, 600], [700, 600], [700, 345], [740, 345]], c: "data", s: "dash", at: 3.1, ord: 3 },
            { id: "conf", pts: [[880, 700], [880, 664]], c: "human", s: "dash", at: 3.95, ord: 3 },
            { id: "spike", pts: [[660, 560], [685, 560], [685, 252], [1065, 252], [1065, 290], [1100, 290]], c: "data", s: "solid", at: 4.3, ord: 4, crit: true },
            { id: "zones", pts: [[1020, 345], [1100, 345]], c: "model", s: "dash", at: 4.55, ord: 4 },
            { id: "class", pts: [[1020, 498], [1100, 498]], c: "model", s: "dash", at: 4.55, ord: 4 },
            { id: "ltd", pts: [[545, 780], [545, 862], [1070, 862], [1070, 720], [1100, 720]], c: "data", s: "solid", at: 5.0, ord: 5 },
            { id: "rule", pts: [[1020, 622], [1100, 622]], c: "model", s: "solid", at: 5.0, ord: 5 },
            { id: "qty", pts: [[1200, 514], [1200, 584]], c: "opt", s: "solid", at: 5.3, ord: 6, crit: true },
            { id: "back", pts: [[1340, 584], [1340, 514]], c: "opt", s: "dot", at: 5.3, ord: 7 },
            { id: "alt", pts: [[1265, 796], [1265, 750]], c: "risk", s: "dash", at: 5.9, ord: 6 },
            { id: "kpi", pts: [[1430, 620], [1470, 620], [1470, 321], [1510, 321]], c: "opt", s: "solid", at: 6.3, ord: 8, crit: true },
            { id: "kpi2", pts: [[1655, 376], [1655, 416]], c: "eval", s: "solid", at: 6.75, ord: 9, crit: true },
            { id: "out", pts: [[1655, 506], [1655, 546]], c: "eval", s: "solid", at: 7.05, ord: 10, crit: true },
            { id: "sweep", pts: [[1655, 710], [1655, 656]], c: "eval", s: "solid", at: 7.35, ord: 10 },
            { id: "rerun", pts: [[1510, 770], [1455, 770], [1455, 714], [1430, 714]], c: "eval", s: "dot", at: 7.35, ord: 9 },
          ];
          const svg = document.getElementById("arch-svg");
          const lenOf = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
          const DASH = { dash: "10 8", dot: "1 9" };
          const defs = document.createElementNS(NS, "defs");
          Object.entries(COL).forEach(([k, c]) => {
            defs.insertAdjacentHTML("beforeend",
              '<marker id="arch-ah-' + k + '" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + c + '"/></marker>');
          });
          svg.appendChild(defs);
          const wireEls = {};
          wires.forEach((w) => {
            const L = lenOf(w.pts);
            w.len = L;
            const d = "M" + w.pts.map((q) => q.join(" ")).join(" L");
            const g = document.createElementNS(NS, "g");
            g.setAttribute("id", "arch-wg-" + w.id);
            svg.appendChild(g);
            // the styled wire fades in behind a solid "pen" stroke that draws the route
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", d);
            p.setAttribute("class", "wire");
            p.setAttribute("stroke", COL[w.c]);
            p.setAttribute("stroke-opacity", "0.8");
            if (DASH[w.s]) p.setAttribute("stroke-dasharray", DASH[w.s]);
            p.setAttribute("marker-end", "url(#arch-ah-" + w.c + ")");
            p.setAttribute("opacity", "0");
            g.appendChild(p);
            const pen = document.createElementNS(NS, "path");
            pen.setAttribute("d", d);
            pen.setAttribute("class", "wire");
            pen.setAttribute("stroke", COL[w.c]);
            pen.setAttribute("stroke-dasharray", L + " " + L);
            pen.setAttribute("stroke-dashoffset", String(L));
            g.appendChild(pen);
            const dur = Math.max(0.35, L / 900);
            tl.fromTo(pen, { attr: { "stroke-dashoffset": L } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.inOut" }, w.at);
            tl.to(pen, { attr: { opacity: 0 }, duration: 0.25 }, w.at + dur);
            tl.fromTo(p, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.25 }, w.at + dur - 0.05);
            wireEls[w.id] = { g, p };
          });

          const pop = (sel, at, from) =>
            tl.fromTo(sel, Object.assign({ opacity: 0, x: 0, y: 0 }, from), { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at);
          // build layer by layer, left to right
          ["#lane-a", "#lane-b", "#lane-c", "#lane-d", "#lane-e"].forEach((l, i) =>
            tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5 + i * 0.08));
          ["#lh-a", "#lh-b", "#lh-c", "#lh-d", "#lh-e"].forEach((l, i) => pop(l, [0.7, 2.0, 2.9, 4.1, 6.1][i], { y: 10 }));
          pop("#n-a0", 0.8, { x: -24 });
          pop("#n-a1", 1.35, { x: -24 });
          pop("#n-a2", 1.45, { x: -24 });
          pop("#n-a3", 1.55, { x: -24 });
          pop("#wl-make", 1.5, {});
          pop("#n-a-note", 1.8, {});
          pop("#n-b1", 2.1, { x: -20 });
          pop("#n-b2", 2.25, { x: -20 });
          pop("#n-b3", 2.4, { x: -20 });
          pop("#n-c1", 3.0, { y: 16 });
          pop("#n-c2", 3.15, { y: 16 });
          pop("#n-c3", 3.3, { y: 16 });
          pop("#wl-window", 3.4, {});
          pop("#n-c4", 3.6, { y: 16 });
          tl.fromTo("#n-d1", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 4.2);
          pop("#wl-spike", 4.7, {});
          pop("#wl-zones", 4.8, {});
          pop("#n-d3", 4.85, { y: 16 });
          pop("#wl-lt", 5.4, {});
          pop(["#wl-qty", "#wl-stock"], 5.5, {});
          pop("#n-d2", 5.6, { y: 16 });
          pop("#n-e1", 6.3, { x: -20 });
          pop("#n-e2", 6.6, { x: -20 });
          pop("#n-e3", 6.9, { x: -20 });
          pop("#n-e4", 7.2, { x: -20 });
          pop("#wl-runs", 7.6, {});
          pop("#n-nfr1", 7.7, { y: 10 });
          tl.fromTo("#arch-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.6);

          // the daily loop runs: day counter 0 -> 731 while packets flow
          const FLOW_START = 8.0, FLOW_END = 11.7;
          const day = { v: 0 }, dEl = document.getElementById("arch-day");
          tl.fromTo("#arch-dfill", { scaleX: 0 }, { scaleX: 1, duration: FLOW_END - FLOW_START, ease: "none" }, FLOW_START);
          tl.to(day, { v: 731, duration: FLOW_END - FLOW_START, ease: "none", onUpdate: () => { dEl.textContent = Math.round(day.v); } }, FLOW_START);

          // data packets in execution order (deterministic, finite repeats)
          const SPEED = 560, STEP = 0.3;
          wires.forEach((w) => {
            const pts = w.pts, travel = Math.max(0.45, w.len / SPEED);
            const kf = [];
            for (let i = 1; i < pts.length; i++) {
              const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              kf.push({ attr: { cx: pts[i][0], cy: pts[i][1] }, duration: (travel * seg) / w.len, ease: "none" });
            }
            const packets = w.len > 400 ? 2 : 1;
            for (let k = 0; k < packets; k++) {
              const c = document.createElementNS(NS, "circle");
              c.setAttribute("r", "6.5");
              c.setAttribute("cx", pts[0][0]);
              c.setAttribute("cy", pts[0][1]);
              c.setAttribute("fill", COL[w.c]);
              c.setAttribute("opacity", "0");
              svg.appendChild(c);
              const start = FLOW_START + w.ord * STEP + (k * travel) / packets;
              const reps = Math.max(0, Math.floor((FLOW_END - start) / (travel + 0.25)) - 1);
              tl.fromTo(c, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.15 }, start);
              tl.to(c, { keyframes: kf, repeat: reps, repeatDelay: 0.25 }, start);
              tl.to(c, { attr: { opacity: 0 }, duration: 0.2 }, FLOW_END);
            }
          });

          // critical path: dim everything else, light the path
          const H = 12.0;
          const critNodes = ["#n-a3", "#n-b1", "#n-b2", "#n-d1", "#n-d3", "#n-e1", "#n-e2", "#n-e3"];
          const otherNodes = ["#n-a0", "#n-a1", "#n-a2", "#n-b3", "#n-c1", "#n-c2", "#n-c3", "#n-c4", "#n-d2", "#n-e4", "#n-nfr1", "#n-a-note",
            "#wl-make", "#wl-window", "#wl-zones", "#wl-stock", "#wl-runs", "#wl-lt"];
          tl.to(otherNodes, { opacity: 0.28, duration: 0.5, ease: "power2.inOut" }, H);
          wires.filter((w) => !w.crit).forEach((w) => tl.to(wireEls[w.id].g, { opacity: 0.18, duration: 0.5 }, H));
          wires.filter((w) => w.crit).forEach((w, i) => {
            tl.to(wireEls[w.id].p, { attr: { "stroke-opacity": 1, "stroke-width": 5.5 }, duration: 0.35, ease: "power2.out" }, H + 0.15 + i * 0.12);
          });
          tl.to(critNodes.filter((n) => !n.startsWith("#n-a3") && n !== "#n-e3"), { boxShadow: "0 0 28px rgba(238,242,246,0.22)", duration: 0.5 }, H + 0.2);
          tl.fromTo(["#n-a3", "#n-e3"], { filter: "drop-shadow(0px 0px 0px rgba(238,242,246,0))" }, { filter: "drop-shadow(0px 0px 14px rgba(238,242,246,0.35))", duration: 0.5 }, H + 0.2);
          tl.fromTo("#arch-crit", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, H + 0.3);
          tl.to("#arch-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["arch"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
