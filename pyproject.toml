[project]
name = "ddmrp-buffers"
version = "0.1.0"
description = "Demand-driven replenishment buffers for an 800-SKU lubricants range, tested against min-max in a two-year daily simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.scripts]
ddmrp-buffers = "ddmrp_buffers.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddmrp_buffers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
