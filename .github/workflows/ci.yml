name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      - name: tests
        run: uv run pytest -q

      # The full experiment is deterministic and takes well under a minute, so CI runs it.
      - name: end-to-end simulation
        run: |
          uv run python scripts/generate_data.py
          uv run ddmrp-buffers --extra-seeds 1 --out ci-outputs
